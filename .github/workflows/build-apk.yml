name: Build APK

# Dijalankan manual: tab Actions -> Build APK -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk tvhome-custom.apk
          gh release create "build-${{ github.run_number }}" tvhome-custom.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "APK launcher dengan kartu next game dan klasemen."
